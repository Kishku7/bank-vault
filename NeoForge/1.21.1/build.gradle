plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

repositories { mavenCentral() }

version = "${mod_version}+${minecraft_version}-neoforge"
group = 'com.kishku7.bankvault'
base { archivesName = 'bank-vault' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    runs { client { client() } }
    mods { bankvault { sourceSet(sourceSets.main) } }
}

processResources {
    def ep = [mod_version: mod_version, neoforgeRange: project.neoforge_range, mcRange: project.mc_range]
    inputs.properties(ep)
    filesMatching('META-INF/neoforge.mods.toml') { expand(ep) }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21; options.compilerArgs += ['-Xlint:all'] }

java { withSourcesJar() }

// cog-materialized tree (scripts/cog-gen.ps1) -- java + era-corrected resources
sourceSets.main.java.srcDir "gen/src/main/java"
sourceSets.main.resources.srcDir "gen/src/main/resources"
