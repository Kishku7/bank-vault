plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

version = "${mod_version}+${minecraft_version}-neoforge"
group = 'com.kishku7.bankvault'
base { archivesName = 'bank-vault' }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Shared single-source-of-truth tree.
sourceSets.main.java.srcDir "../../shared_minecraft/src/main/java"
sourceSets.main.resources.srcDir "../../shared_minecraft/src/main/resources"

neoForge {
    version = project.neo_version
    runs {
        server { server(); programArgument '--nogui' }
        client { client() }
    }
    mods {
        bankvault { sourceSet(sourceSets.main) }
    }
}

processResources {
    // 26.x pack_format > 81 needs the exact-single range form (see Fabric/26 + pack-formats.md)
    def packFormat = (System.getenv('PACK_FORMAT') ?: '88')
    def ep = [mod_version: mod_version, mcRange: project.mc_range, neoforgeRange: project.neoforge_range]
    inputs.properties(ep + [packFormat: packFormat])
    filesMatching('META-INF/neoforge.mods.toml') { expand(ep) }
    filesMatching('pack.mcmeta') { expand([packFormat: packFormat]) }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xlint:all'] }
