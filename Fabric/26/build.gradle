plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

version = "${project.mod_version}+${project.minecraft_version}-fabric"
group = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    accessWidenerPath = file("src/main/resources/bankvault.accesswidener")
}

// Shared single-source-of-truth tree.
// 26.3-snapshot-2 removed the block MapCodec surface, so 26.3+ builds use a cog-materialized
// gen/ tree (walker runs scripts/cog-gen.ps1 -Cell Fabric/26 -Ver 26.3 then passes -PuseGen);
// 26.1/26.2 keep the plain shared srcDir.
// D16 (2026-07-10): all 26 cells cog-materialize gen/ (shared_minecraft eliminated).
sourceSets.main.java.setSrcDirs(["gen/src/main/java"])
sourceSets.main.resources.setSrcDirs(["gen/src/main/resources"])

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    compileOnly localRuntime("net.fabricmc:fabric-loader:${project.loader_version}")
    compileOnly localRuntime("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")
    // soft compat: Trinkets, compileOnly, never shipped / never required
    compileOnly files("libs/trinkets-4.0.0-beta.2+26.1.jar")
}

processResources {
    // 26.x resource pack_format is > 81, so the strict codec DEMANDS min_format/max_format --
    // ship the exact-single range form, value injected per 26.X by scripts/build-fabric.ps1
    // (PACK_FORMAT env). See Memory/knowledge/pack-formats.md. (This block was MISSING until
    // 1.4.0+: 26.1/26.2 fabric jars shipped a literal ${packFormat} = invalid JSON = the whole
    // bankvault resource namespace failed to load. Caught in the 1.4.0 GUI spot-play.)
    def packFormat = (project.findProperty("pack_format") ?: System.getenv("PACK_FORMAT") ?: "84")
    inputs.properties(["version": project.version, "mcLower": project.mc_lower, "mcUpper": project.mc_upper, "packFormat": packFormat])
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mcLower": project.mc_lower, "mcUpper": project.mc_upper
    }
    filesMatching("pack.mcmeta") { expand "packFormat": packFormat }
}

tasks.withType(JavaCompile).configureEach { it.options.encoding = "UTF-8"; it.options.release = 25; it.options.compilerArgs += ['-Xlint:all'] }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
